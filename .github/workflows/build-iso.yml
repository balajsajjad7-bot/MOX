name: Build MOX ISO

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          sudo docker image prune --all --force
          df -h /

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mmdebstrap ubuntu-keyring squashfs-tools xorriso mtools dosfstools

      - name: Build ISO
        run: sudo MOX_WORK=/mnt/mox-work MOX_OUT="$PWD/out" build/build-iso.sh

      - name: Split ISO for GitHub's 2 GB file limit
        run: |
          cd out
          split -b 1900M -d "$(ls *.iso)" "$(ls *.iso).part"
          ls -lh

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/*.part* out/*.sha256 --title "MOX $GITHUB_REF_NAME" --notes "Join the parts, check the SHA-256, then write the ISO to a USB drive. See README."

      - name: Keep ISO parts as a workflow download
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: mox-iso
          path: |
            out/*.part*
            out/*.sha256
          compression-level: 0
