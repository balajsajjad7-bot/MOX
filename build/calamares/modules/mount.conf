---
extraMounts:
  - device: proc
    fs: proc
    mountPoint: /proc
  - device: sys
    fs: sysfs
    mountPoint: /sys
  - device: /dev
    mountPoint: /dev
    options: [ bind ]
  - device: tmpfs
    fs: tmpfs
    mountPoint: /run
  - device: /run/udev
    mountPoint: /run/udev
    options: [ bind ]
  - device: efivarfs
    fs: efivarfs
    mountPoint: /sys/firmware/efi/efivars
    efi: true
mountOptions:
  - filesystem: default
    options: [ defaults ]
  - filesystem: ext4
    ssdOptions: [ discard ]
  - filesystem: btrfs
    options: [ defaults, noatime ]
    ssdOptions: [ discard, compress=zstd ]
  - filesystem: xfs
    ssdOptions: [ discard ]
