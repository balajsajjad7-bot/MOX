---
dontChroot: false
timeout: 900
script:
  - "apt-get purge -y casper calamares || true"
  - "rm -f /usr/share/applications/mox-install.desktop /etc/xdg/autostart/mox-live.desktop /etc/casper.conf"
  - "systemctl disable mox-live-display.service || true"
  - "rm -rf /etc/calamares"
  - "update-initramfs -c -k all || update-initramfs -u -k all"
