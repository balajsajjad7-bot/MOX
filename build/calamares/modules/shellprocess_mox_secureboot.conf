---
# Installs the Microsoft-signed boot chain, so MOX starts with Secure Boot on
# even when the installer itself ran with Secure Boot off.
dontChroot: false
timeout: 300
script:
  - "[ ! -d /sys/firmware/efi ] || grub-install --target=x86_64-efi --efi-directory=/boot/efi --bootloader-id=ubuntu --uefi-secure-boot --force || true"
  - "[ ! -d /sys/firmware/efi ] || { mkdir -p /boot/efi/EFI/BOOT && cp /boot/efi/EFI/ubuntu/shimx64.efi /boot/efi/EFI/BOOT/BOOTX64.EFI && cp /boot/efi/EFI/ubuntu/grubx64.efi /boot/efi/EFI/ubuntu/mmx64.efi /boot/efi/EFI/BOOT/; } || true"
