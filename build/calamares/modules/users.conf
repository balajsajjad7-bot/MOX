---
defaultGroups:
  - adm
  - cdrom
  - dip
  - plugdev
  - lpadmin
  - name: sudo
    must_exist: true
    system: true
  - name: docker
    must_exist: false
    system: true
  - name: wireshark
    must_exist: false
    system: true
  - name: libvirt
    must_exist: false
    system: true
  - name: kvm
    must_exist: false
    system: true
autologinGroup: autologin
doAutologin: false
sudoersGroup: sudo
setRootPassword: false
doReusePassword: false
passwordRequirements:
  minLength: 8
  maxLength: -1
allowWeakPasswords: false
user:
  shell: /bin/bash
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "mox"
