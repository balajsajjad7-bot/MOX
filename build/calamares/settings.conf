---
modules-search: [ local ]
instances:
- id: mox_finish
  module: shellprocess
  config: shellprocess_mox_finish.conf
sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - grubcfg
  - shellprocess@mox_finish
  - bootloader
  - umount
- show:
  - finished
branding: mox
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
